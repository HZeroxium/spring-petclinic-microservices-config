# apps/preview/appset.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: preview-apps
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/HZeroxium/spring-petclinic-microservices-config.git
      revision: HEAD
      directories:
        - path: values/preview/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/HZeroxium/spring-petclinic-microservices-config
        targetRevision: HEAD
        path: charts/spring-petclinic-service
        helm:
          valueFiles:
            - ../../values/preview/{{path.basename}}/values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: 'preview-{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
