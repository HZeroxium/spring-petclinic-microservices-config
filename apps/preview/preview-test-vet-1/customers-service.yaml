
# apps/preview/preview-test-vet-1/customers-service.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: customers-service-preview-test-vet-1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/HZeroxium/spring-petclinic-microservices-config'
    targetRevision: HEAD
    path: charts/spring-petclinic-service
    helm:
      valueFiles:
        - ../../values/preview/preview-test-vet-1/values-customers-service.yaml
      releaseName: customers-service
  destination:
    server: https://kubernetes.default.svc
    namespace: preview-preview-test-vet-1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
