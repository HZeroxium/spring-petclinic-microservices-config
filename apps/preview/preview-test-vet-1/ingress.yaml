
# apps/preview/preview-test-vet-1/ingress.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-preview-test-vet-1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/HZeroxium/spring-petclinic-microservices-config'
    targetRevision: HEAD
    path: ingress/preview/preview-test-vet-1
  destination:
    server: https://kubernetes.default.svc
    namespace: preview-preview-test-vet-1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
